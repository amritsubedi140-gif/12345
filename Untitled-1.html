
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratik</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050510;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    h1 {
      color: #00ffff;
      font-size: clamp(2rem, 8vw, 5rem);
      text-align: center;
      text-shadow:
        0 0 10px #00ffff,
        0 0 25px #00ffff,
        0 0 50px #0088ff;
      animation: glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #00ffff,
                     0 0 20px #00ffff;
      }
      to {
        text-shadow: 0 0 20px #ff00ff,
                     0 0 40px #ff00ff,
                     0 0 70px #8800ff;
      }
    }
  </style>
</head>
<body>
  <h1>PRATIK RANDI</h1>
</body>
</html>
